# Checks every pull request before it can reach the GitHub Pages site (deploy.yml runs on main).
# The VitePress build fails on dead internal links, so a broken page or link blocks the merge.
name: CI

on:
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Lint & build site
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
            # bun from mise.toml (not "latest")
            - name: Setup mise
              uses: DCC-BS/ci-workflows/actions/setup-mise@6b2f0bb53bac8ccb9847ba77f68f62488b668f6d # v10.0.3
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Lint
              run: bunx biome ci .
            - name: Build with VitePress
              run: bun run build
            - name: Compile Agent Skills
              run: bun run package-skills
