[tools]
# TEMPORARY until 2026-10-29: bun 1.4.4 fixes CVE-2026-111497 (Brotli decoder) but is younger than
# the 7-day cooldown. The weekly dependency routine deletes this comment once 1.4.4 is 7 days old.
bun = "1.4.4"
usage = "7.0.1"
node = "24.22.1"

[hooks]
postinstall = { task = "install" }

[tasks.install]
env = { APP_MODE = "build" }
description = "install npm packages"
run = "bun install"

[tasks.dev]
description = "start the development server"
run = "bunx vitepress dev"

[tasks.build]
description = "build the production bundle"
run = "bunx vitepress build"

[tasks.check]
description = "check and fix linting issues"
run = "bunx biome check --fix"
